<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="keywords" content="jQuery Chat, floating chat, chat widget, launcher, popup, jqxChat" />
    <meta name="description"
        content="jqxChat in popup mode - a floating launcher button in the corner of the page opens an AI assistant panel, the pattern used for site help widgets." />
    <title id='Description'>jqxChat popup mode: a floating launcher button opens the AI assistant panel.</title>
    <link rel="stylesheet" href="../../../jqwidgets/styles/jqx.base.css" type="text/css" />
    <link rel="stylesheet" href="../../../jqwidgets/styles/jqx.light.css" type="text/css" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1 minimum-scale=1" />
    <script type="text/javascript" src="../../../scripts/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../../../scripts/demos.js"></script>
    <script type="text/javascript" src="../../../jqwidgets/jqxcore.js"></script>
    <script type="text/javascript" src="../../../jqwidgets/jqxbuttons.js"></script>
    <script type="text/javascript" src="../../../jqwidgets/jqxchat.js"></script>
    <script type="text/javascript" src="mockassistant.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            // mode: 'popup' renders a floating launcher button in the corner.
            // Clicking it toggles the chat panel. In a real app set apiKey / proxyUrl
            // instead of sendRequest.
            $('#chat').jqxChat({
                colorScheme: 'light',
                theme: 'light',
                mode: 'popup',
                launcherPosition: 'bottom-right',
                width: 380,
                height: 560,
                title: 'Help Assistant',
                subtitle: 'Ask us anything',
                welcomeMessage: 'Hi! How can we help you today?',
                starterPrompts: ['What is jQWidgets?', 'How do I get support?'],
                sendRequest: jqxChatMock
            });

            // you can also drive the popup programmatically:
            $('#openBtn').jqxButton({ theme: 'light', width: 150, height: 30 });
            $('#openBtn').on('click', function () { $('#chat').jqxChat('toggle'); });
        });
    </script>
    <style>
        .page { max-width: 640px; }
        .page h2 { color: #2b6cb0; }
        .page p { line-height: 1.6; color: #444; }
    </style>
</head>

<body class='default'>
    <div class="page">
        <h2>Floating AI assistant</h2>
        <p>
            Look at the <strong>bottom-right corner</strong> - a launcher button floats above the page.
            Click it to open the assistant panel; click the panel's <em>x</em> to collapse it back to the button.
        </p>
        <p>This is the classic "support bubble" pattern, built entirely with <code>jqxChat</code> in popup mode.</p>
        <p><input type="button" id="openBtn" value="Toggle from code" /></p>
    </div>

    <div id="chat"></div>
</body>

</html>
