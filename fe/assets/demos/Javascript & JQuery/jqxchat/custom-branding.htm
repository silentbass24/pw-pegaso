<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="keywords" content="jQuery Chat, custom avatars, branding, chat assistant, jqxChat" />
    <meta name="description"
        content="Brand the jqxChat assistant with custom avatars, name, title and subtitle - shown with an offline mock backend." />
    <title id='Description'>Brand the jqxChat assistant with custom avatars, name, title and subtitle.</title>
    <link rel="stylesheet" href="../../../jqwidgets/styles/jqx.base.css" type="text/css" />
    <link rel="stylesheet" href="../../../jqwidgets/styles/jqx.light.css" type="text/css" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1 minimum-scale=1" />
    <script type="text/javascript" src="../../../scripts/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../../../scripts/demos.js"></script>
    <script type="text/javascript" src="../../../jqwidgets/jqxcore.js"></script>
    <script type="text/javascript" src="../../../jqwidgets/jqxchat.js"></script>
    <script type="text/javascript" src="mockassistant.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            // small inline SVG data-URI avatars so the demo has no external assets.
            var botAvatar = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#2b6cb0"/>' +
                '<circle cx="32" cy="26" r="12" fill="#fff"/><rect x="14" y="42" width="36" height="18" rx="9" fill="#fff"/></svg>');
            var userAvatar = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#48bb78"/>' +
                '<text x="32" y="42" font-size="30" fill="#fff" text-anchor="middle" font-family="Arial">U</text></svg>');

            $('#chat').jqxChat({
                colorScheme: 'light',
                theme: 'light',
                width: 440,
                height: 600,
                title: 'Nova',
                subtitle: 'Your product guide',
                botName: 'Nova',
                userName: 'Me',
                botAvatar: botAvatar,
                userAvatar: userAvatar,
                showTimestamps: true,
                sendButtonIcon: true,
                welcomeMessage: 'Hi, I\'m **Nova** - your product guide. What would you like to know?',
                starterPrompts: ['What is jQWidgets?', 'Show me a code example'],
                sendRequest: jqxChatMock
            });
        });
    </script>
    <style>
        p.hint { max-width: 620px; font-size: 13px; line-height: 1.55; color: #444; }
        p.hint code { background: #eef2f7; color: #b03060; padding: 1px 5px; border-radius: 3px; }
    </style>
</head>

<body class='default'>
    <p class="hint">
        Give the assistant a personality: set <code>title</code>, <code>subtitle</code>, <code>botName</code>,
        <code>userName</code> and image <code>botAvatar</code> / <code>userAvatar</code> (any URL or data-URI).
        Leave the avatars unset to fall back to themed initials.
    </p>
    <div id="chat"></div>
</body>

</html>
