<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KairosMed - Gestione Disponibilità</title>
    <meta name="author" content="Paolo Ciola" />
    <meta name="description" content="Pagina di gestione delle disponibilità" />

    <!-- Tailwind -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css?family=Karla:400,700&display=swap");
      .font-family-karla {
        font-family: karla;
      }
      .bg-sidebar {
        background: #3d68ff;
      }
      .cta-btn {
        color: #3d68ff;
      }
      .upgrade-btn {
        background: #1947ee;
      }
      .upgrade-btn:hover {
        background: #0038fd;
      }
      .active-nav-link {
        background: #1947ee;
      }
      .nav-item:hover {
        background: #1947ee;
      }
      .account-link:hover {
        background: #3d68ff;
      }
      td > button { margin-left: 0.25rem; margin-right: 0.25rem; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    
    <script src="../api/get-slot.js"></script>
  </head>
  <body class="bg-gray-100 font-family-karla flex">
    <aside class="relative bg-sidebar h-screen w-64 hidden sm:block shadow-xl">
      <div class="p-6">
        <a
          href="slot.html"
          class="text-white text-3xl font-semibold uppercase hover:text-gray-300"
          >Gestione Disponibilità</a
        >
        <a
          href="nuovo-slot.html"
          class="button w-full bg-white cta-btn font-semibold py-2 mt-5 rounded-br-lg rounded-bl-lg rounded-tr-lg shadow-lg hover:shadow-xl hover:bg-gray-300 flex items-center justify-center"
        >
          <i class="fas fa-plus mr-3"></i> Nuova Fascia Oraria
        </a>
      </div>
      <nav class="text-white text-base font-semibold pt-3">
        <a
          href="dashboard.html"
          class="flex items-center text-white opacity-75 hover:opacity-100 py-4 pl-6 nav-item"
        >
          <i class="fas fa-tachometer-alt mr-3"></i>
          Home
        </a>
        
        <a
          href="appuntamenti.html"
          class="flex items-center text-white opacity-75 hover:opacity-100 py-4 pl-6 nav-item"
        >
          <i class="fas fa-calendar mr-3"></i>
          Appuntamenti
        </a>
      </nav>
      <a
        href="#"
        class="absolute w-full upgrade-btn bottom-0 active-nav-link text-white flex items-center justify-center py-4"
      >
    </aside>

    <div class="relative w-full flex flex-col h-screen overflow-y-hidden">
      <!-- Desktop Header -->
      <header class="w-full items-center bg-white py-2 px-6 hidden sm:flex">
        <div class="w-1/2"></div>
        <div x-data="{ isOpen: false }" class="relative w-1/2 flex justify-end">
          <button
            @click="isOpen = !isOpen"
            class="realtive z-10 w-12 h-12 rounded-full overflow-hidden border-4 border-gray-400 hover:border-gray-300 focus:border-gray-300 focus:outline-none"
          >
            <img src="https://source.unsplash.com/uJ8LNVCBjFQ/400x400" />
          </button>
          <button
            x-show="isOpen"
            @click="isOpen = false"
            class="h-full w-full fixed inset-0 cursor-default"
          ></button>
          <div
            x-show="isOpen"
            class="absolute w-32 bg-white rounded-lg shadow-lg py-2 mt-16"
          >
            <a href="#" class="block px-4 py-2 account-link hover:text-white"
              >Account</a
            >
            <a href="#" class="block px-4 py-2 account-link hover:text-white"
              >Support</a
            >
            <a href="#" class="block px-4 py-2 account-link hover:text-white"
              >Sign Out</a
            >
          </div>
        </div>
      </header>

      <!-- Mobile Header & Nav -->
      <header
        x-data="{ isOpen: false }"
        class="w-full bg-sidebar py-5 px-6 sm:hidden"
      >
        <div class="flex items-center justify-between">
          <a
            href="dashboard.html"
            class="text-white text-3xl font-semibold uppercase hover:text-gray-300"
            >Home</a
          >
          <button
            @click="isOpen = !isOpen"
            class="text-white text-3xl focus:outline-none"
          >
            <i x-show="!isOpen" class="fas fa-bars"></i>
            <i x-show="isOpen" class="fas fa-times"></i>
          </button>
        </div>

        <!-- Dropdown Nav -->
        <nav :class="isOpen ? 'flex': 'hidden'" class="flex flex-col pt-4">
          <a
            href="dashboard.html"
            class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item"
          >
            <i class="fas fa-tachometer-alt mr-3"></i>
            Home
          </a>
          <a
            href="appuntamenti.html"
            class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item"
          >
            <i class="fas fa-sticky-note mr-3"></i>
            Appuntamenti
          </a>
         <!--<a
            href="#"
            class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item"
          >
            <i class="fas fa-cogs mr-3"></i>
            Support
          </a>
          <a
            href="#"
            class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item"
          >
            <i class="fas fa-user mr-3"></i>
            My Account
          </a>
          <a
            href="#"
            class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item"
          >
            <i class="fas fa-sign-out-alt mr-3"></i>
            Sign Out
          </a> -->
        </nav>
        <!-- <button class="w-full bg-white cta-btn font-semibold py-2 mt-5 rounded-br-lg rounded-bl-lg rounded-tr-lg shadow-lg hover:shadow-xl hover:bg-gray-300 flex items-center justify-center">
                <i class="fas fa-plus mr-3"></i> New Report
            </button> -->
      </header>

      <div class="w-full h-screen overflow-x-hidden border-t flex flex-col">
        <main class="w-full flex-grow p-6">
          <h1 class="text-3xl text-black pb-6">Fasce Orarie per Disponibilità</h1>

          <div class="w-full mt-6">
            <p class="text-xl pb-3 flex items-center">
              <i class="fas fa-list mr-3"></i> Elenco Fasce Orarie
            </p>
            <div class="bg-white overflow-auto">
              <div class="flex items-center justify-between p-4">
                <div>
                  <label for="slot-pagesize" class="text-sm mr-2"
                    >Righe per pagina:</label
                  >
                  <select
                    id="slot-pagesize"
                    class="border rounded px-2 py-1"
                  >
                    <option value="1">1</option>
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                  </select>
                </div>
                <div id="slot-pagination" class="mt-0"></div>
              </div>

              <table id="slot-table" class="min-w-full bg-white">
                <thead class="bg-gray-800 text-white">
                  <tr>
                    <th
                      class="w-2/8 text-left py-3 px-4 uppercase font-semibold text-sm"
                    >
                      Ora Inizio
                    </th>
                    <th
                      class="w-2/8 text-left py-3 px-4 uppercase font-semibold text-sm"
                    >
                      Ora Fine
                    </th>
                    <th
                      class="w-1/8 text-left py-3 px-4 uppercase font-semibold text-sm overflow-auto"
                    >
                      Azioni
                    </th>
                  </tr>
                </thead>
                <tbody class="text-gray-700">
                  <tr>
                    <td class="w-1/3 text-left py-3 px-4">08:00</td>
                    <td class="w-1/3 text-left py-3 px-4">10:00</td>
                    <td class="text-left py-3 px-4">
                      <button title="Modifica" >
                        <span class="material-symbols-outlined">edit</span>
                      </button>
                      <button title="Elimina" >
                        <span class="material-symbols-outlined">delete</span>
                      </button>
                    </td>
                  </tr>
                  <tr class="bg-gray-200">
                    <td class="w-1/3 text-left py-3 px-4">10:00</td>
                    <td class="w-1/3 text-left py-3 px-4">12:00</td>
                    <td class="text-left py-3 px-4">
                      <button title="Modifica" >
                        <span class="material-symbols-outlined">edit</span>
                      </button>
                      <button title="Elimina" >
                        <span class="material-symbols-outlined">delete</span>
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td class="w-1/3 text-left py-3 px-4">12:00</td>
                    <td class="w-1/3 text-left py-3 px-4">14:00</td>
                    <td class="text-left py-3 px-4">
                      <button title="Modifica" >
                        <span class="material-symbols-outlined">edit</span>
                      </button>
                      <button title="Elimina" >
                        <span class="material-symbols-outlined">delete</span>
                      </button>
                    </td>
                  </tr>
                  <tr class="bg-gray-200">
                    <td class="w-1/3 text-left py-3 px-4">14:00</td>
                    <td class="w-1/3 text-left py-3 px-4">16:00</td>
                    <td class="text-left py-3 px-4">
                      <button title="Modifica" >
                        <span class="material-symbols-outlined">edit</span>
                      </button>
                      <button title="Elimina" >
                        <span class="material-symbols-outlined">delete</span>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>

          
          </div>
        </main>

        <footer class="w-full bg-white text-right p-4">
        </footer>
      </div>
    </div>


    <!-- AlpineJS -->
    <script
      src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js"
      defer
    ></script>
    <!-- Font Awesome -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js"
      integrity="sha256-KzZiKy0DWYsnwMF+X1DvQngQ2/FxF7MF3Ff72XcpuPs="
      crossorigin="anonymous"
    ></script>
  </body>
</html>
