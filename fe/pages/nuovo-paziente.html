    <!-- Tailwind -->

<body class="bg-gray-100 font-family-karla flex">

        <nav class="text-white text-base font-semibold pt-3">

                Dashboard

            <a href="pazienti.html" class="flex items-center text-white opacity-75 hover:opacity-100 py-4 pl-6 nav-item">

                Pazienti
            </a>
        </nav>
    </aside>

    <div class="relative w-full flex flex-col h-screen overflow-y-hidden">
        <!-- Desktop Header -->
        <header class="w-full items-center bg-white py-2 px-6 hidden sm:flex">
            <div class="w-1/2"></div>
            <div x-data="{ isOpen: false }" class="relative w-1/2 flex justify-end">

                    <img src="https://source.unsplash.com/uJ8LNVCBjFQ/400x400">
                </button>
                <button x-show="isOpen" @click="isOpen = false" class="h-full w-full fixed inset-0 cursor-default"></button>
                <div x-show="isOpen" class="absolute w-32 bg-white rounded-lg shadow-lg py-2 mt-16">
                    <a href="#" class="block px-4 py-2 account-link hover:text-white">Account</a>
                    <a href="#" class="block px-4 py-2 account-link hover:text-white">Support</a>
                    <a href="#" class="block px-4 py-2 account-link hover:text-white">Sign Out</a>
                </div>
            </div>
        </header>

        <!-- Mobile Header & Nav -->
        <header x-data="{ isOpen: false }" class="w-full bg-sidebar py-5 px-6 sm:hidden">
            <div class="flex items-center justify-between">
                <a href="index.html" class="text-white text-3xl font-semibold uppercase hover:text-gray-300">Admin</a>
                <button @click="isOpen = !isOpen" class="text-white text-3xl focus:outline-none">
                    <i x-show="!isOpen" class="fas fa-bars"></i>
                    <i x-show="isOpen" class="fas fa-times"></i>
                </button>
            </div>

            <!-- Dropdown Nav -->
            <nav :class="isOpen ? 'flex': 'hidden'" class="flex flex-col pt-4">
                <a href="index.html" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    Dashboard
                </a>
                <a href="blank.html" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-sticky-note mr-3"></i>
                    Blank Page
                </a>
                <a href="tables.html" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-table mr-3"></i>
                    Tables
                </a>
                <a href="forms.html" class="flex items-center active-nav-link text-white py-2 pl-4 nav-item">
                    <i class="fas fa-align-left mr-3"></i>
                    Forms
                </a>
                <a href="tabs.html" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-tablet-alt mr-3"></i>
                    Tabbed Content
                </a>
                <a href="calendar.html" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-calendar mr-3"></i>
                    Calendar
                </a>
                <a href="#" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-cogs mr-3"></i>
                    Support
                </a>
                <a href="#" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">
                    <i class="fas fa-user mr-3"></i>
                    My Account
                </a>
                <a href="#" class="flex items-center text-white opacity-75 hover:opacity-100 py-2 pl-4 nav-item">

            <!-- <button class="w-full bg-white cta-btn font-semibold py-2 mt-5 rounded-br-lg rounded-bl-lg rounded-tr-lg shadow-lg hover:shadow-xl hover:bg-gray-300 flex items-center justify-center">
                <i class="fas fa-plus mr-3"></i> New Report
            </button> -->
        </header>
    
        <div class="w-full h-screen overflow-x-hidden border-t flex flex-col">
            <main class="w-full flex-grow p-6 ">
                <h1 class="w-full text-3xl text-black pb-6 text-center">Nuovo Paziente</h1>

                <div class="flex flex-wrap justify-center">
                    <div class="w-full lg:w-1/2 my-6 pr-0 lg:pr-2">

                    <div class="w-full lg:full mt-6 pl-0 lg:pl-2">
                        <!--<p class="text-xl pb-6 flex items-center">
                            <i class="fas fa-list mr-3"></i> Nuovo paziente
                        </p>-->
                        <div class="leading-loose">
                            <form id="nuovo-paziente" class="p-10 bg-white rounded shadow-xl">
                                <p class="text-lg text-gray-800 font-medium pb-4">Anagrafica</p>
                                <div class="">
                                    <label class="block text-sm text-gray-600" for="nome">Nome</label>
                                    <input class="w-full px-5 py-3 text-gray-700 bg-gray-200 rounded" id="nome" name="nome" type="text" required="true" placeholder="Nome" aria-label="Name">
                                </div>
                                <div class="">
                                    <label class="block text-sm text-gray-600" for="cognome">Cognome</label>
                                    <input class="w-full px-5 py-3 text-gray-700 bg-gray-200 rounded" id="cognome" name="cognome" type="text" required="true" placeholder="Cognome" aria-label="Cognome">
                                </div>
                                <div class="">
                                    <label class="block text-sm text-gray-600" for="data_nascita">Data di nascita</label>
                                    <input class="w-full px-5 py-3 text-gray-700 bg-gray-200 rounded" id="data_nascita" name="data_nascita" type="date" required="true" placeholder="Data di nascita" aria-label="Data di nascita">
                                </div>
                                <div class="">
                                    <label class="block text-sm text-gray-600" for="codice_fiscale">Codice Fiscale</label>
                                    <input class="w-full px-5 py-3 text-gray-700 bg-gray-200 rounded" id="codice_fiscale" name="codice_fiscale" type="text" minlength="16" maxlength="16" required="true" placeholder="Codice Fiscale" aria-label="Codice Fiscale">
                                </div>
                                <p class="text-lg text-gray-800 font-medium pb-4 pt-10">Residenza</p>
                                <div class="">
                                    <label class="block text-sm text-gray-600" for="indirizzo">Indirizzo</label>
                                    <input class="w-full px-5 py-3 text-gray-700 bg-gray-200 rounded" id="indirizzo" name="indirizzo" type="text" required="true" placeholder="Indirizzo" aria-label="Indirizzo">
                                </div>
                                <div class="inline-block mt-2 -mx-1 pl-1 w-1/4">
                                    <label class="block text-sm text-gray-600" for="numero_civico">Civico</label>
                                    <input class="w-full px-5 py-3 text-gray-700 bg-gray-200 rounded" id="numero_civico" name="numero_civico" type="text" required="true" placeholder="Civico" aria-label="Civico">
                                </div>
                                <div class="inline-block mt-2 mx-1 pl-1 w-1/2">
                                    <label class="text-sm block text-gray-600" for="citta">Città</label>
                                    <input class="w-full px-2 py-3 text-gray-700 bg-gray-200 rounded" id="citta" name="citta" type="text" required="true" placeholder="Città" aria-label="Città">
                                </div>
                                <div class="inline-block mt-2 -mx-1 pl-1 w-1/4">
                                    <label class=" block text-sm text-gray-600" for="cap">CAP</label>
                                    <input class="w-full px-2 py-3 text-gray-700 bg-gray-200 rounded" id="cap"  name="cap" type="text" required="true" placeholder="CAP" aria-label="CAP">
                                </div>
                                <p class="text-lg text-gray-800 font-medium pb-4 pt-10">Informazioni di contatto</p>
                                <div class="inline-block mt-2 -mx-1 pl-1 w-1/3">
                                    <label class="block text-sm text-gray-600" for="email">Email</label>
                                    <input class="w-full px-2  py-3 text-gray-700 bg-gray-200 rounded" id="email" name="email" type="email" required="" placeholder="Indirizzo email" aria-label="Email">
                                </div>
                                <div class="inline-block mt-2 mx-1 pl-1 w-1/3">
                                    <label class="block text-sm text-gray-600" for="telefono">Telefono</label>
                                    <input class="w-full px-2  py-3 text-gray-700 bg-gray-200 rounded" id="telefono" name="telefono" type="text" minlenght="10" maxlenght="15" required="" placeholder="Telefono" aria-label="Telefono">
                                </div>
                                <div class="inline-block mt-2 -mx-1 pl-1 w-1/3">
                                    <label class="block text-sm text-gray-600" for="mobile">Mobile</label>
                                    <input class="w-full px-2  py-3 text-gray-700 bg-gray-200 rounded" id="mobile" name="mobile" type="number" minlenght="10" maxlenght="15" required="" placeholder="Mobile" aria-label="Mobile">
                                </div>
                                <div class="mt-6">
                                    <button id="nuovo-paziente" class="px-4 py-1 text-white font-light tracking-wider bg-gray-900 rounded" type="submit"><span id="testo_bottone"></span>
                                    </button>
                                    <p class="text-lg text-gray-800 font-medium pb-4 pt-10">Anamnesi paziente</p>
                                    <div class="flex content-evenly space-x-2">
                                        <button id="anamnesi-attuale" class="px-4 py-2 text-white text-sm font-light tracking-wider bg-gray-900 rounded" type="submit"><span id="testo_bottone"></span>
                                        </button>
                                        <button id="anamnesi-remota" class="px-4 py-2 text-white text-sm font-light tracking-wider bg-gray-900 rounded" type="submit"><span id="testo_bottone"></span>
                                        </button>
                                        <button id="anamnesi-psico" class="px-4 py-2 text-white text-sm font-light tracking-wider bg-gray-900 rounded" type="submit"><span id="testo_bottone"></span>
                                        </button>
                                        <button id="anamnesi-familiare" class="px-4 py-2 text-white text-sm font-light tracking-wider bg-gray-900 rounded" type="submit"><span id="testo_bottone"></span>
                                        </button>
                                        <button id="farmaci-e-allergie" class="px-4 py-2 text-white text-sm font-light tracking-wider bg-gray-900 rounded" type="submit"><span id="testo_bottone"></span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
    
            <footer class="w-full bg-white text-right p-4">
            </footer>
        </div>
        
    </div>

    <!-- AlpineJS -->
    <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js" defer></script>
    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js" integrity="sha256-KzZiKy0DWYsnwMF+X1DvQngQ2/FxF7MF3Ff72XcpuPs=" crossorigin="anonymous"></script>
</body>
</html>
